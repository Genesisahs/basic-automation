- name: Push latest host-RHEL8 inventory file to GitLab Inventory folder
  hosts: localhost
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    git_repo_url: "https://oauth2:{{ gitlab_token }}@gitlab.tools.sde.sp.gc1.myngc.com/c2net/ansible-playbooks.git"
    repo_local_path: "/tmp/ansible-playbooks"
    inventory_source_dir: "/var/lib/jenkins/jobs/RHEL IP Generator/workspace/linux/jenkin-Playbook/host-RHEL8-20260624-1749.yml"
    inventory_file_pattern: 
      - "host-RHEL8-*.yml"
      - "host-RHEL9-*.yml"
    git_commit_message: "Add latest host-RHEL8 inventory file {{ lookup('pipe','date -u +%Y%m%d-%H%M') }}"

  tasks:

    - name: Find all host-RHEL8 inventory files in source dir
      find:
        paths: "{{ inventory_source_dir }}"
        patterns: "{{ inventory_file_pattern }}"
        file_type: file
      register: found_files

    - name: Fail if no inventory files found
      fail:
        msg: "No host-RHEL-8 or host-RHEL-9 inventory files found"
      when: found_files.files | length == 0

    - name: Sort files by newest
      set_fact:
        sorted_files: "{{ found_files.files | sort(attribute='path') | reverse }}"

    - name: Select latest inventory file
      set_fact:
        latest_inventory_file: "{{ sorted_files[0].path }}"

    - name: Show selected file
      debug:
        msg: "Latest inventory file: {{ latest_inventory_file }}"

    - name: Clone or update GitLab repo
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ repo_local_path }}"
        version: main
        update: yes
        force: yes

    - name: Copy latest inventory file into repo
      copy:
        src: "{{ latest_inventory_file }}"
        dest: "{{ repo_local_path }}/linux/jenkin-Playbook/Inventory/{{ latest_inventory_file | basename }}"
        remote_src: yes

    - name: Show inventory directory contents
      command: ls -l "{{ repo_local_path }}/linux/jenkin-Playbook/Inventory"
      register: inventory_listing

    - debug:
        var: inventory_listing.stdout_lines

    - name: Show git status before staging
      command: git status -s
      args:
        chdir: "{{ repo_local_path }}"
      register: git_status_before

    - debug:
        var: git_status_before.stdout_lines

    - name: Stage new inventory file
      command: git add linux/jenkin-Playbook/Inventory/{{ latest_inventory_file | basename }}
      args:
        chdir: "{{ repo_local_path }}"

    # FIX 1: Git identity configuration (REQUIRED for commit success)
    - name: Configure git user name
      command: git config user.name "AWX Automation"
      args:
        chdir: "{{ repo_local_path }}"

    - name: Configure git user email
      command: git config user.email "awx-automation@company.local"
      args:
        chdir: "{{ repo_local_path }}"

    - name: Check git changes before commit
      command: git status --porcelain
      args:
        chdir: "{{ repo_local_path }}"
      register: git_changes

    - debug:
        var: git_changes.stdout_lines

    - name: Commit changes if any
      command: git commit -m "{{ git_commit_message }}"
      args:
        chdir: "{{ repo_local_path }}"
      when: git_changes.stdout != ""

    - name: Show last commit
      command: git log -1 --oneline
      args:
        chdir: "{{ repo_local_path }}"
      register: git_last_commit
      when: git_changes.stdout != ""

    - debug:
        var: git_last_commit.stdout
      when: git_changes.stdout != ""

    - name: Push changes to GitLab
      command: git push origin main --verbose
      args:
        chdir: "{{ repo_local_path }}"
      when: git_changes.stdout != ""
